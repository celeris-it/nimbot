services:
  server:
    build:
      context: .
      dockerfile: infrastructure/docker/server.Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:?Set TELEGRAM_ALLOWED_USER_IDS}
      TELEGRAM_OWNER_USER_ID: ${TELEGRAM_OWNER_USER_ID:-}
      AGENT_ID: ${AGENT_ID:-default}
      AGENT_NAME: ${AGENT_NAME:-Agente}
      PANEL_PASSWORD_HASH: ${PANEL_PASSWORD_HASH:?Set PANEL_PASSWORD_HASH}
      PANEL_URL: ${PANEL_URL:-http://localhost:3000}
      PANEL_HOST: 0.0.0.0
      PANEL_PORT: 3000
      SERVER_STATE_DIR: /home/node/.local/share/nimbot
      AGENT_HOST_TOKEN: ${AGENT_HOST_TOKEN:?Set AGENT_HOST_TOKEN}
      AGENT_HOST_URL: http://agent-host:3001
    volumes:
      - server-state:/home/node/.local/share/nimbot
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    cpus: 1
    mem_limit: 512m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  agent-host:
    build:
      context: .
      dockerfile: infrastructure/docker/agent-host.Dockerfile
    entrypoint: ["node", "/app/apps/agent-host/dist/serve.js"]
    init: true
    restart: unless-stopped
    environment:
      WORKSPACE: /workspace
      AGENT_HOST_TOKEN: ${AGENT_HOST_TOKEN:?Set AGENT_HOST_TOKEN}
    volumes:
      - agent-workspace:/workspace
      - agent-engine-state:/home/node/.local/share/opencode
      - agent-task-state:/home/node/.local/share/nimbot
    cpus: 1
    mem_limit: 1g
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health', {headers: {Authorization: 'Bearer ' + process.env.AGENT_HOST_TOKEN}, signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
volumes:
  server-state:
  agent-workspace:
  agent-engine-state:
  agent-task-state:
