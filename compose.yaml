services:
  server:
    image: nimbot-server
    container_name: ${SERVER_CONTAINER_NAME:-nimbot-server}
    build:
      context: .
      dockerfile: infrastructure/docker/server.Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PANEL_PASSWORD_HASH: ${PANEL_PASSWORD_HASH:?Set PANEL_PASSWORD_HASH}
      PANEL_URL: ${PANEL_URL:-http://localhost:3000}
      PANEL_HOST: 0.0.0.0
      PANEL_PORT: 3000
      SERVER_STATE_DIR: /home/node/.local/share/nimbot
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      AGENT_HOST_IMAGE: ${AGENT_HOST_IMAGE:?Set AGENT_HOST_IMAGE to the immutable Agent Host image ID}
      SERVER_CONTAINER_NAME: ${SERVER_CONTAINER_NAME:-nimbot-server}
      TASK_TIMEOUT_SECONDS: ${TASK_TIMEOUT_SECONDS:-600}
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      - server-state:/home/node/.local/share/nimbot
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    cpus: 1
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  server-state:
