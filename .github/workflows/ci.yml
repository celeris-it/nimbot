name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test tests/native-server.integration.test.ts
        env:
          NIMBOT_TEST_NATIVE_BUILD: "1"
      - name: Install pinned OpenCode for native verification
        run: |
          mkdir -p "$RUNNER_TEMP/nimbot-opencode"
          pnpm --dir "$RUNNER_TEMP/nimbot-opencode" add --allow-build=@opencode/cli @opencode/cli@2.2.7
          echo "$RUNNER_TEMP/nimbot-opencode/node_modules/.bin" >> "$GITHUB_PATH"
      - run: pnpm test tests/native-opencode.integration.test.ts
        env:
          NIMBOT_TEST_NATIVE_OPENCODE: "1"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test tests/native-browser.integration.test.ts
        env:
          NIMBOT_TEST_NATIVE_BROWSER: "1"
      - run: pnpm test:panel
      - name: Build single-container application
        run: docker build -f infrastructure/docker/nimbot.Dockerfile -t nimbot:test .
      - run: pnpm test tests/application-container.integration.test.ts
        env:
          NIMBOT_TEST_APPLICATION_IMAGE: nimbot:test
